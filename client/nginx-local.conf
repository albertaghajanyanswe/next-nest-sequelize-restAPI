upstream app_server {
    server localhost:4000;
    keepalive 100;
}

server {
    listen 80;
    # listen 443 ssl;
    # server_name         localhost;

    # gzip on;
    # gzip_disable "msie6";

    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_min_length 0;
    # gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/ttf application/javascript font/opentype image/svg+xml image/ico;

    add_header Cache-Control "max-age=31536000, public";

    # Handle API routes
    location /api/ {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 405 =200 $uri;
        proxy_redirect off;
    }

    # Handle localized routes
    location ~ ^/(en|ru)/ {
        root /usr/share/nginx/html;
        # try_files $uri $uri/ /index.html;
        try_files $uri $uri/ /$1/404.html =404;
        expires -1;
        add_header Pragma no-cache;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0, max-age=0";
    }

    # Handle all other routes by serving the frontend
    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Pragma no-cache;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0, max-age=0";
    }

    error_page 404 /404.html;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}